<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="style_profile.css" />
  </head>

  <body class="root-start">
    <div class="card-background" id="cardBackground">
      <div class="card-background-layer" id="cardBgLayerA"></div>
      <div class="card-background-layer" id="cardBgLayerB"></div>
    </div>

    <!-- ================= 1. HERO ================= -->
    <div class="hero">
      <div class="scene-wrapper">
        <!-- ---- Nav bar: Projects/Media tabs + profile switcher ---- -->

        <nav class="nav-bar ease-in" id="navBar">
          <button class="nav-tab active" type="button" data-view="projects">
            Projects
          </button>
          <button class="nav-tab" type="button" data-view="media">Media</button>

          <!-- profile switcher (avatar button + dropdown) -->
          <div class="profile-nav-wrapper">
            <button
              class="profile-nav profile-nav--photo"
              type="button"
              id="profileNavButton"
              aria-haspopup="true"
              aria-expanded="false"
              style="
                background-image: url(&quot;../assets/images/leni_funny.jpg&quot;);
              "
            ></button>

            <div class="profile-menu" id="profileMenu">
              <span class="profile-menu-item current" aria-current="page">
                <span
                  class="profile-menu-avatar"
                  style="
                    background-image: url(&quot;../assets/images/leni_funny.jpg&quot;);
                  "
                ></span>
                Leni Juresa
              </span>
              <a class="profile-menu-item" href="../recruiter/recruiter.html">
                <span
                  class="profile-menu-avatar"
                  style="
                    background-image: url(&quot;../assets/images/default.png&quot;);
                  "
                ></span>
                Recruiter
              </a>
              <a class="profile-menu-item" href="../developer/developer.html">
                <span
                  class="profile-menu-avatar"
                  style="
                    background-image: url(&quot;../assets/images/default.png&quot;);
                  "
                ></span>
                Developer
              </a>
              <a class="profile-menu-item" href="../guest/guest.html">
                <span
                  class="profile-menu-avatar"
                  style="
                    background-image: url(&quot;../assets/images/default.png&quot;);
                  "
                ></span>
                Guest
              </a>
              <a class="profile-menu-item" href="../index.html">log out</a>
            </div>
          </div>
        </nav>

        <!-- ---- Card selector: PROJECTS tab ---- -->
        <div class="profile-selector view active-view" data-view="projects">
          <div class="profile-track ease-in" id="profileTrack-projects">
            <!-- Discover -->
            <div
              class="profile-item ease-in"
              data-title="Discover"
              data-desc="Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua."
              data-bg="../assets/images/bg-discover.jpg"
            >
              <div class="profile-card">D</div>
              <span class="profile-name">Discover </span>
            </div>

            <!-- Welcome (default selected on load) — has its own widgets
                 below instead of the shared card-detail text panel. Any
                 card can do this: add a <template class="card-widgets">
                 with your own <div class="widget-tile"> tiles inside it,
                 and its widgets show up instead of the text panel when
                 that card is selected. -->
            <div
              class="profile-item ease-in"
              data-title="Welcome"
              data-bg="../assets/images/temp-bg-ai.jpg"
            >
              <div class="profile-card">W</div>
              <span class="profile-name"
                >Welcome<img
                  src="../assets/icons/badge.svg"
                  alt="PS Plus"
                  class="name-icon"
              /></span>
              <template class="card-widgets">
                <div
                  class="widget-tile widget-tile--2"
                  data-popup="welcome"
                  tabindex="0"
                  role="button"
                  aria-haspopup="dialog"
                >
                  <h3 class="widget-title">Welcome Back</h3>
                  <p class="widget-text">
                    Browse the library above to see all of my projects. Head to
                    Discover to "pre-order" projects still in the works, or
                    check the next card for more about me. Switch to Media to
                    see it all in action. Cards are browsable using arrow keys
                    or with your mouse. <br />
                    <strong>Click to see more!</strong>
                  </p>
                </div>

                <div
                  class="widget-tile widget-tile--1"
                  data-popup="trophies"
                  tabindex="0"
                  role="button"
                  aria-haspopup="dialog"
                >
                  <h3 class="widget-title">Trophies</h3>
                  <p class="widget-text">
                    IRL achivements like 2nd place hackathon...
                  </p>
                </div>

                <div
                  class="widget-tile widget-tile--1"
                  data-popup="storage"
                  tabindex="0"
                  role="button"
                  aria-haspopup="dialog"
                >
                  <h3 class="widget-title">Storage</h3>
                  <p class="widget-text">
                    Tech stack. showing what programing languages i know and
                    which ones i know the best
                  </p>
                </div>

                <div
                  class="widget-tile widget-tile--1"
                  data-popup="messages"
                  tabindex="0"
                  role="button"
                  aria-haspopup="dialog"
                >
                  <h3 class="widget-title">Messages</h3>
                  <p class="widget-text">
                    Feedback from people, professors, someone who uses the
                    apps..
                  </p>
                </div>
                <div
                  class="widget-tile widget-tile--1"
                  data-popup="activity"
                  tabindex="0"
                  role="button"
                  aria-haspopup="dialog"
                >
                  <h3 class="widget-title">Latest activity</h3>
                  <p class="widget-text">
                    What project i'm working on right now.
                  </p>
                </div>
              </template>
            </div>

            <!-- About me -->
            <div
              class="profile-item ease-in"
              data-title="About me"
              data-bg="../assets/images/aboutme-temp-ai.jpg"
            >
              <div
                class="profile-card profile-card--photo"
                style="
                  background-image: url(&quot;../assets/images/leni_funny.jpg&quot;);
                "
              ></div>
              <span class="profile-name">About me</span>
              <template class="profile-desc">
                <p>poštovani,</p>

                <div
                  class="widget-tile widget-tile--1"
                  data-popup="fact"
                  tabindex="0"
                  role="button"
                  aria-haspopup="dialog"
                  style="max-width: 320px; margin: 20px 0"
                >
                  <h3 class="widget-title">Quick fact</h3>
                  <p class="widget-text">
                    A small widget sitting right in the middle of the text.
                  </p>
                </div>

                <p>Hvala, Lijepi pozdrav<br />Doviđenja<br /></p>
              </template>
            </div>

            <!-- Project 2 -->
            <div
              class="profile-item ease-in"
              data-title="Project 2"
              data-desc="Sunt in culpa qui officia deserunt mollit anim id est laborum. Curabitur pretium tincidunt lacus, ut interdum tellus elit sed risus."
              data-bg="../assets/images/bg-project2.jpg"
            >
              <div class="profile-card">2</div>
              <span class="profile-name">Project 2</span>
            </div>

            <!-- Project 3 -->
            <div
              class="profile-item ease-in"
              data-title="Project 3"
              data-desc="Maecenas eget condimentum velit, sit amet feugiat lectus. Class aptent taciti sociosqu ad litora torquent per conubia nostra."
              data-bg="../assets/images/bg-project3.jpg"
            >
              <div class="profile-card">3</div>
              <span class="profile-name">Project 3</span>
            </div>

            <!-- Guest -->
            <div
              class="profile-item ease-in"
              data-title="Guest"
              data-desc="Per inceptos himenaeos. In pellentesque faucibus vestibulum. Nulla at nulla justo, eget luctus tortor."
              data-bg="../assets/images/bg-guest.jpg"
            >
              <div
                class="profile-card profile-card--photo"
                style="
                  background-image: url(&quot;../assets/images/default.png&quot;);
                "
              ></div>
              <span class="profile-name">Guest</span>
            </div>
          </div>
        </div>

        <!-- ---- Card selector: MEDIA tab ---- -->
        <div class="profile-selector view" data-view="media">
          <div class="profile-track ease-in" id="profileTrack-media">
            <!-- Project pictures -->
            <div
              class="profile-item"
              data-title="Project pictures"
              data-desc="Curabitur non nulla sit amet nisl tempus convallis quis ac lectus. Vivamus magna justo, lacinia eget consectetur sed."
              data-bg="../assets/images/bg-projectpictures.jpg"
            >
              <div class="profile-card">-</div>
              <span class="profile-name">project pictures</span>
            </div>

            <!-- My profile -->
            <div
              class="profile-item"
              data-title="My profile"
              data-desc="Convallis convallis tellus id interdum velit laoreet id donec ultrices. Nulla facilisi etiam dignissim diam quis enim lobortis."
              data-bg="../assets/images/bg-myprofile.jpg"
            >
              <div class="profile-card">-</div>
              <span class="profile-name"
                >My profile<img
                  src="../assets/icons/badge.svg"
                  alt="PS Plus"
                  class="name-icon"
              /></span>
            </div>

            <!-- Pictures 2 -->
            <div
              class="profile-item ease-in"
              data-href="profiles/leni/leniprofile.html"
              data-title="Pictures 2"
              data-desc="Pellentesque habitant morbi tristique senectus et netus et malesuada fames ac turpis egestas."
              data-bg="../assets/images/bg-pictures2.jpg"
            >
              <div class="profile-card">-</div>
              <span class="profile-name">pictures 2</span>
            </div>

            <!-- Pictures 3 -->
            <div
              class="profile-item"
              data-title="Pictures 3"
              data-desc="Vestibulum ante ipsum primis in faucibus orci luctus et ultrices posuere cubilia curae."
              data-bg="../assets/images/bg-pictures3.jpg"
            >
              <div class="profile-card">-</div>
              <span class="profile-name">pictures 3</span>
            </div>

            <!-- Pictures 4 -->
            <div
              class="profile-item"
              data-title="Pictures 4"
              data-desc="Fusce dapibus, tellus ac cursus commodo, tortor mauris condimentum nibh, ut fermentum massa justo sit amet risus."
              data-bg="../assets/images/bg-pictures4.jpg"
            >
              <div class="profile-card">-</div>
              <span class="profile-name">pictures 4</span>
            </div>

            <!-- Guest -->
            <div
              class="profile-item ease-in"
              data-title="Guest"
              data-desc="Aenean lacinia bibendum nulla sed consectetur. Donec ullamcorper nulla non metus auctor fringilla."
              data-bg="../assets/images/bg-guest-media.jpg"
            >
              <div
                class="profile-card profile-card--photo"
                style="
                  background-image: url(&quot;../assets/images/default.png&quot;);
                "
              ></div>
              <span class="profile-name">Guest</span>
            </div>
          </div>
        </div>

        <!-- ---- Clock ---- -->
        <div class="clock" id="clock"></div>
      </div>
    </div>

    <!-- ================= 2. CARD DETAIL ================= -->

    <section class="card-detail" id="cardDetail">
      <div class="card-detail-inner">
        <h2 class="card-detail-title" id="cardDetailTitle"></h2>
        <div class="card-detail-text" id="cardDetailText"></div>
      </div>
    </section>

    <!-- ================= 2b. WIDGETS ================= -->
    <!-- Shared, generic widgets panel. script.js fills this in from
         whichever selected card has a <template class="card-widgets">
         inside it — any card can define its own independent set. -->
    <section class="widget-grid ease-in" id="widgetsPanel"></section>

    <!-- ================= 2c. WIDGET POPUP ================= -->
    <div class="widget-popup-overlay" id="widgetPopupOverlay">
      <div
        class="widget-popup"
        role="dialog"
        aria-modal="true"
        aria-labelledby="widgetPopupTitle"
      >
        <button
          class="widget-popup-close"
          id="widgetPopupClose"
          type="button"
          aria-label="Close"
        >
          &times;
        </button>
        <h2 class="widget-popup-title" id="widgetPopupTitle"></h2>
        <div class="widget-popup-body" id="widgetPopupBody"></div>
      </div>
    </div>

    <!-- ================= 3. SCRIPTS ================= -->
    <script src="script.js"></script>
  </body>
</html>
