            <!-- Welcome (default selected on load) — has its own widgets

                 card can do this: add a <template class="card-widgets">

                 and its widgets show up instead of the text panel when
                 that card is selected. -->
            <div

              data-title="Welcome"
              data-bg="../assets/images/temp-bg-ai.jpg"
            >
              <div class="profile-card">W</div>
              <span class="profile-name">Welcome</span>
              <template class="card-widgets">
                <div
                  class="widget-tile widget-tile--2"
                  data-popup="welcome"
                  tabindex="0"
                  role="button"
                  aria-haspopup="dialog"
                >
                  <h3 class="widget-title">Welcome Back</h3>
                  <p class="widget-text">
                    Browse the library above to see all of my projects. Head to
                    Discover to "pre-order" projects still in the works, or
                    check the next card for more about me. Switch to Media to
                    see it all in action. Cards are browsable using arrow keys
                    or with your mouse. <br />
                    <strong>Click to see more!</strong>
                  </p>
                </div>

                <div
                  class="widget-tile widget-tile--1"
                  data-popup="trophies"
                  tabindex="0"
                  role="button"
                  aria-haspopup="dialog"
                >
                  <h3 class="widget-title">Trophies</h3>
                  <p class="widget-text">
                    IRL achivements like 2nd place hackathon...
                  </p>

                <div
                  class="widget-tile widget-tile--1"
                  data-popup="storage"
                  tabindex="0"
                  role="button"
                  aria-haspopup="dialog"

                    which ones i know the best
                  </p>
                </div>

                <div
                  class="widget-tile widget-tile--1"
                  data-popup="messages"
                  tabindex="0"
                  role="button"
                  aria-haspopup="dialog"
                >
                  <h3 class="widget-title">Messages</h3>
                  <p class="widget-text">
                    Feedback from people, professors, someone who uses the
                    apps..
                  </p>
                </div>
                <div
                  class="widget-tile widget-tile--1"
                  data-popup="activity"
                  tabindex="0"
                  role="button"
                  aria-haspopup="dialog"
                >

                  <p class="widget-text">
                    What project i'm working on right now.

            <!-- About me -->
            <div
              class="profile-item ease-in"
              data-title="About me"
              data-bg="../assets/images/aboutme-temp-ai.jpg"
            >
              <div
                class="profile-card profile-card--photo"
                style="
                  background-image: url(&quot;../assets/images/leni_funny.jpg&quot;);
                "
              ></div>
              <span class="profile-name"
                >About me<img
                  src="../assets/icons/badge.svg"
                  alt="dev icon"
                  class="name-icon"
              /></span>
              <template class="profile-desc">
                <p class="text">
                  Hey, I'm Leni. I'm an Informatics student at the Polytechnic
                  of Rijeka, based in <strong>Rijeka</strong>, Croatia.I enjoy
                  programing websites, both frontend and backend, and I dabble
                  in software development here and there. My main tools are
                  HTML, CSS, Python, JavaScript, Java, PHP, SQL, NoSQL Right now
                  I'm building this portfolio over summer break as practice.
                </p>

                <p class="text">
                  EDMS, an anonymous police reporting system with live
                  dispatcher chat, is a project I'm very proud of. I built it
                  during a student exchange, working as a two-person team, and
                  handled the entire backend myself. The project with actual
                  users is an app I built for my local church. It replaced
                  around a hundred handwritten notes a month and saved countless
                  hours of manual work with a system for managing people's
                  duties, schedules, and printed documents. I've also built
                  smaller things for fun or for a college course, like an ISS
                  tracker using a Flask API, with a live map showing the
                  station's location.
                </p>

                <p class="text">
                  What actually got me into programming was gaming, wondering
                  how the games I played were built and how their mechanics
                  worked. That curiosity spread to everyday systems too. I'm
                  still curious about how a string of 0s and 1s can end up
                  controlling something physical. I enjoy backend work the most,
                  actually making something function, but I like frontend just
                  as much.
                </p>

                <p class="text">
                  Right now my main focus is finishing my degree, and these
                  projects are a big part of that. They're where I actually get
                  to apply what I'm learning. If you want to see more of what
                  I've built, here's my GitHub: https://github.com/LeniJuresa.
                </p>

                <div

                  tabindex="0"
                  role="button"
                  aria-haspopup="dialog"

    <!-- ================= 2. CARD DETAIL ================= -->

    <section class="card-detail" id="cardDetail">
      <div class="card-detail-inner">
        <h2 class="card-detail-title" id="cardDetailTitle"></h2>
        <div class="card-detail-text" id="cardDetailText"></div>
      </div>

    <!-- ================= 2b. WIDGETS ================= -->
    <!-- Shared, generic widgets panel. script.js fills this in from
         whichever selected card has a <template class="card-widgets">
         inside it — any card can define its own independent set. -->
    <section class="widget-grid ease-in" id="widgetsPanel"></section>

    <!-- ================= 2c. WIDGET POPUP ================= -->
    <div class="widget-popup-overlay" id="widgetPopupOverlay">
      <div
        class="widget-popup"
        role="dialog"
        aria-modal="true"
        aria-labelledby="widgetPopupTitle"
      >
        <button
          class="widget-popup-close"
          id="widgetPopupClose"
          type="button"
          aria-label="Close"
        >
          &times;
        </button>
        <h2 class="widget-popup-title" id="widgetPopupTitle"></h2>
        <div class="widget-popup-body" id="widgetPopupBody"></div>
      </div>
    </div>

    <!-- ================= 2d. IMAGE POPUP ================= -->
    <!-- Reused by any .gallery-item, wherever one exists. -->
    <div class="image-popup-overlay" id="imagePopupOverlay">
      <div
        class="image-popup"
        role="dialog"
        aria-modal="true"
        aria-label="Image preview"
      >
        <button
          class="image-popup-close"
          id="imagePopupClose"
          type="button"
          aria-label="Close"
        >
          &times;
        </button>
        <img id="imagePopupImg" src="" alt="" />
      </div>
    </div>
