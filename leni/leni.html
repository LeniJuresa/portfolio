                <!-- 3. CORE FEATURES -->
                <section id="features">
                  <h3 class="project-h">Project overview</h3>
                  <p class="project-prose">
                    EDMS is a web platform designed to handle emergency reports quickly and connect the public with emergency dispatchers in real time. It allows anyone to send an urgent report without needing an account, while providing dispatchers and system administrators with dedicated dashboards to review reports, communicate, and take action.

                    Note: Built as a college project with a classmate, this is currently an unfinished proof of concept, but it's something I’d like to revisit and expand in the future.
                  </p>

                  <h3 class="project-h project-h--gap">Core features</h3>
                  <div class="project-text-grid">
                    <article>
                      <h4>Anonymous incident submission</h4>
                      <p>Anyone can report an incident without creating an account or logging in. The form captures the location, incident details, and optional photo evidence.</p>
                    </article>
                    <article>
                      <h4>Live two-way chat</h4>
                      <p>After submitting a report, the user is given a private access link that opens a direct chat window with the dispatcher handling their case.</p>
                    </article>
                    <article>
                      <h4>Dispatcher control panel</h4>
                      <p>Dispatchers can view all incoming unassigned reports. To prevent two people from working on the same issue, a dispatcher must claim a report before reviewing the photo evidence, chatting with the user, and officially marking it as Accepted or Denied.</p>
                    </article>
                    <article>
                      <h4>Admin overview and staff control</h4>
                      <p>Administrators can see overall system stats, such as total, pending, and resolved cases, as well as how long each issue took to resolve. They can also create and manage new staff accounts.</p>
                    </article>
                    <article>
                      <h4>Automatic live updates</h4>
                      <p>Both the chat rooms and the dispatcher overview check the server every two seconds using background requests. This keeps messages and report statuses updated on screen without needing to refresh the page.</p>
                    </article>
                    <article>
                      <h4>Near real-time without WebSockets</h4>
                      <p>Instead of setting up external socket servers or paid third-party services, the application uses periodic asynchronous polling. The browser automatically requests new data in the background, updates only the changed parts of the page, and locks the chat and action buttons as soon as a report is closed.</p>
                    </article>
                  </div>
                </section>

                <!-- 3. CORE FEATURES -->
                <section id="features">
                  <h3 class="project-h">Project overview</h3>
                  <p class="project-prose">
                    
                    This software was made to save time for my local church, replacing manualy writing hundreds of papers every month. 
                    It has a central database where adding, editing, removing people is as simple as a single click. Made as simple as possible so anyone can understand and use it. 
                    With a single press of a button the stored names are formated in a 2x3 grid on a A4 paper size with empty grid checks so no paper is wasted. 
                  </p>

                  <h3 class="project-h project-h--gap">Core features</h3>
                  <div class="project-text-grid">
                    <article>
                      <h4>Table display </h4>
                      <p>Add, Edit, Remove, view tasks for that month in a simple table</p>
                    </article>
                    <article>
                      <h4>Task position</h4>
                      <p>At the end of every month the software manager needs to press a single button and every person in the database and the list is moved to the next position and asigned a next task for that month-</p>
                    </article>
                    <article>
                      <h4>Automatic print formating</h4>
                      <p>With a press of a single button, all of the people in the database and their position is saved and prepared for printing. The software takes a name, the tash and the date to when the task is supposed to be finished and saves it on a grid formated to a A4 paper. 6 leaflets are fitted on a single paper and deppending on how many people there are, the software creates the amount of papers needed to print every person.</p>
                    </article>
                    <article>
                      <h4>Easy to understand UI</h4>
                      <p>The UI has been designed with elderly people in mind. Simple UI and simple usage. </p>
                    </article>
                  </div>
                </section>

<!-- Cover image on top, big intro text, two text columns -->
<template data-popup-key="welcome" data-title="How this site works" data-size="xl"
          data-cover="../assets/images/temp-bg-ai.jpg">
          

  <p class="pb-lead">
    This portfolio is built like a PlayStation 5 home screen. Your projects are
    "games" in a library, and there is even a store to browse them. It is written
    from scratch with plain HTML, CSS and JavaScript , with no frameworks and minimal use of AI
  </p>

  <!-- <div class="pb-tags"><span>HTML</span><span>CSS</span><span>JavaScript</span></div> -->

  <h4 class="pb-h">Getting around</h4>
  <div class="pb-cols pb-cols--2">
    <div class="pb-card">
      <b>Profile row</b>
      <p>The row of square cards at the top is the library. Use the <b>← →</b> arrow keys or click a card to select it. The title, background and widgets below change to match the selected card.<br> </br></p>
    </div>
    <div class="pb-card">
      <b>Projects &amp; Media tabs</b>
      <p><b>Projects</b> holds the store, this welcome page and my work. <b>Media</b> holds galleries and a look at my life outside of code. Switching tabs returns you to the second card.</p>
    </div>
    <div class="pb-card">
      <b>Profile switcher</b>
      <p>The round avatar in the top right opens a menu with other profiles (Recruiter, Developer, Guest), each tailored to a different visitor, and a log out link.<br>   </br></p>
    </div>
    <div class="pb-card">
      <b>Widgets &amp; popups</b>
      <p>Tiles with a pointer cursor open a popup like this one. Close it with <b>× or Esc</b> Photos in galleries open in a lightbox you can flip through with the arrow keys.</p>
    </div>
  </div>

  <h4 class="pb-h">The Project Store (Discover card)</h4>
  <p>Discover is a fake store where every project is on sale for 100% off. Nothing is charged and nothing is downloaded to your device.</p>
  <ul class="pb-list">
    <li><b>Featured banner:</b> shows my highlighted projects and rotates every 5 seconds. It pauses while you hover it or focus it, and you can use the arrows or dots to change slides.</li>
    <li><b>Filters:</b> <b>All</b>, <b>Released</b> (finished projects), <b>Coming soon</b> (in development) and <b>My library</b> (what you have "bought" so far).</li>
    <li><b>Project page:</b> click any tile to see its description, tech stack, features, rating and tags.</li>
    <li><b>Buying:</b> <b>Buy now</b> (or <b>Pre-order</b> for unfinished projects) walks through order summary, payment (tick the terms box), processing and a confirmation with an order number.</li>
    <li><b>Download:</b> a released project can be "installed" with a progress bar. It is a simulation, but it unlocks the next step.</li>
    <li><b>Launch project:</b> after installing, this scrolls you back up and jumps to that project's own card in the library.</li>
    <li><b>Pre-orders:</b> unfinished projects show as pre-ordered and cannot be launched yet.</li>
    <li><b>Wishlist:</b> save a project with the heart button.</li>
  </ul>
  <p class="pb-sub">Your library and wishlist are kept in memory only, so they reset when you refresh the page.</p>

  <h4 class="pb-h">How it is built</h4>
  <div class="pb-cols pb-cols--2">
    <ul class="pb-list">
      <li><b>Card selector:</b> one function handles every row, so adding a card is just adding HTML.</li>
      <li><b>Templates:</b> widgets and popups are written as HTML <code>&lt;template&gt;</code> blocks and copied into the page when needed.</li>
      <li><b>Scaling:</b> the whole scene is designed at 1920×1080 and scaled to fit the screen.</li>
    </ul>
    <ul class="pb-list">
      <li><b>Backgrounds:</b> each card sets its own background image, crossfaded between two layers.</li>
      <li><b>Store:</b> a single list of project objects in <code>script.js</code> drives the banner, tiles, filters and checkout.</li>
      <li><b>GitHub activity:</b> the Latest activity popup reads public data from GitHub's API.</li>
    </ul>
  </div>

  <hr class="pb-divider">
  <p>Some parts of this site do more than they let on. Finding them is half the fun. ;)</p>
</template>
