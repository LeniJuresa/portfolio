                    class="gallery-item"
                    tabindex="0"
                    role="button"
                    aria-haspopup="dialog"
                  >
                    <img
                      src="../assets/galery/placeholder.svg"
                      alt="Gallery photo 2"
                      loading="lazy"
                    />
                  </div>

                  <div
                    class="gallery-item"
                    tabindex="0"
                    role="button"
                    aria-haspopup="dialog"
                  >
                    <img
                      src="../assets/galery/placeholder.svg"
                      alt="Gallery photo 4"
                      loading="lazy"
                    />
                  </div>
                  <div
                    class="gallery-item"
                    tabindex="0"
                    role="button"
                    aria-haspopup="dialog"
                  >
                    <img
                      src="../assets/galery/placeholder.svg"
                      alt="Gallery photo 5"
                      loading="lazy"
                    />
                  </div>

                  
                </div>

              </template>
            </div>
          </div>
        </div>

        <!-- ---- Clock ---- -->
        <div class="clock" id="clock"></div>
      </div>
    </div>

    <!-- ================= 2. CARD DETAIL ================= -->

    <section class="card-detail" id="cardDetail">
      <div class="card-detail-inner">
        <h2 class="card-detail-title" id="cardDetailTitle"></h2>
        <div class="card-detail-text" id="cardDetailText"></div>
      </div>
    </section>

    <!-- ================= 2b. WIDGETS ================= -->
    <!-- Shared, generic widgets panel. script.js fills this in from
         whichever selected card has a <template class="card-widgets">
         inside it — any card can define its own independent set. -->
    <section class="widget-grid ease-in" id="widgetsPanel"></section>

    <!-- ================= 2c. WIDGET POPUP ================= -->
    <div class="widget-popup-overlay" id="widgetPopupOverlay">
      <div
        class="widget-popup"
        role="dialog"
        aria-modal="true"
        aria-labelledby="widgetPopupTitle"
      >
        <button
          class="widget-popup-close"
          id="widgetPopupClose"
          type="button"
          aria-label="Close"
        >
          &times;
        </button>
        <h2 class="widget-popup-title" id="widgetPopupTitle"></h2>
        <div class="widget-popup-body" id="widgetPopupBody"></div>
      </div>
    </div>

    <!-- ================= 2d. IMAGE POPUP ================= -->
    <!-- Reused by any .gallery-item, wherever one exists. -->
    <div class="image-popup-overlay" id="imagePopupOverlay">
      <button
        class="image-popup-nav image-popup-prev"
        id="imagePopupPrev"
        type="button"
        aria-label="Previous image"
      >
        &#10094;
      </button>
      <div
        class="image-popup"
        role="dialog"
        aria-modal="true"
        aria-label="Image preview"
      >
        <button
          class="image-popup-close"
          id="imagePopupClose"
          type="button"
          aria-label="Close"
        >
          &times;
        </button>
        <img id="imagePopupImg" src="" alt="" />
      </div>
      <button
        class="image-popup-nav image-popup-next"
        id="imagePopupNext"
        type="button"
        aria-label="Next image"
      >
        &#10095;
      </button>
    </div>

    <!-- ================= 3. SCRIPTS ================= -->
    <script src="script.js"></script>
  </body>
</html>
