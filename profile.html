<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="root-start">
    <div class="light-rays-wrapper">
      <div class="light-rays"></div>
    </div>
    <div class="sparkle-field" id="sparkleField"></div>

    <div class="light"></div>

    <p class="start-info-large">Welcome to My Website</p>
    <p class="start-info-text">Who's using this website?</p>

    <div class="profile-selector">
      <div class="profile-track" id="profileTrack">
        <div class="profile-card">1</div>
        <div class="profile-card">2</div>
        <div class="profile-card">3</div>
        <div class="profile-card">4</div>
        <div class="profile-card">5</div>
      </div>
    </div>
    <div class="clock" id="clock"></div>

    <p class="tooltip">
      Use arrow keys to navigate <br />Press enter to select<br />
    </p>

    <!-- Smile :) 
    <div class="circle"></div>
    <div class="eyes"></div>
    <div class="mouth"></div>
    <div class="eyebrow-left"></div>
    <div class="eyebrow-right"></div>
    -->
    <script src="script.js"></script>
  </body>
</html>
